<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#09090b" />
  
  <!-- Subtle Grid/Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05" />
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="100" />
    </filter>
  </defs>
  
  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="200" cy="150" r="400" fill="url(#glow)" filter="url(#blur)" />
  
  <!-- Content -->
  <g transform="translate(100, 200)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="28" font-weight="600" letter-spacing="3" fill="#8b5cf6" text-transform="uppercase">
      Harness Engineering
    </text>
    
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">
      The Missing Reliability Layer
    </text>
    <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">
      in Agentic AI Systems
    </text>
    
    <rect x="0" y="250" width="48" height="48" rx="24" fill="#ffffff" fill-opacity="0.15" />
    <text x="24" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
    <text x="64" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="32" font-weight="500" fill="#a1a1aa">
      Abinesh
    </text>
  </g>
</svg>
