<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">The loop engineering core loop</title>
  <desc id="desc">A seven-stage agent loop: discover, handoff, execute, observe, verify, persist, and decide. The loop returns to discovery only when new evidence justifies another attempt.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10z" fill="#667085"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#f8fafc"/>
  <path d="M220 187C290 90 420 65 520 110M680 110C805 65 915 100 980 190M1044 288C1090 385 1060 492 974 550M870 622C770 705 630 705 532 646M410 646C285 680 175 620 146 515M118 420C83 330 112 245 172 203" fill="none" stroke="#98a2b3" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="96" y="132" width="190" height="92" rx="16" fill="#fff" stroke="#d0d5dd"/><rect x="370" y="62" width="190" height="92" rx="16" fill="#fff" stroke="#d0d5dd"/><rect x="650" y="62" width="190" height="92" rx="16" fill="#fff" stroke="#d0d5dd"/><rect x="928" y="190" width="190" height="92" rx="16" fill="#fff" stroke="#d0d5dd"/><rect x="888" y="500" width="190" height="92" rx="16" fill="#fff" stroke="#d0d5dd"/><rect x="510" y="608" width="190" height="92" rx="16" fill="#fff" stroke="#d0d5dd"/><rect x="112" y="500" width="190" height="92" rx="16" fill="#fff" stroke="#d0d5dd"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#101828">
    <text x="120" y="164" font-size="13" font-weight="700" letter-spacing="2" fill="#667085">01 / SIGNAL</text><text x="120" y="198" font-size="24" font-weight="700">Discover</text>
    <text x="394" y="94" font-size="13" font-weight="700" letter-spacing="2" fill="#667085">02 / CONTRACT</text><text x="394" y="128" font-size="24" font-weight="700">Handoff</text>
    <text x="674" y="94" font-size="13" font-weight="700" letter-spacing="2" fill="#667085">03 / ACTION</text><text x="674" y="128" font-size="24" font-weight="700">Execute</text>
    <text x="952" y="222" font-size="13" font-weight="700" letter-spacing="2" fill="#667085">04 / FEEDBACK</text><text x="952" y="256" font-size="24" font-weight="700">Observe</text>
    <text x="912" y="532" font-size="13" font-weight="700" letter-spacing="2" fill="#667085">05 / PROOF</text><text x="912" y="566" font-size="24" font-weight="700">Verify</text>
    <text x="534" y="640" font-size="13" font-weight="700" letter-spacing="2" fill="#667085">06 / MEMORY</text><text x="534" y="674" font-size="24" font-weight="700">Persist</text>
    <text x="136" y="532" font-size="13" font-weight="700" letter-spacing="2" fill="#667085">07 / CONTROL</text><text x="136" y="566" font-size="24" font-weight="700">Decide</text>
  </g>
  <circle cx="600" cy="372" r="130" fill="#101828"/><circle cx="600" cy="372" r="105" fill="none" stroke="#475467" stroke-width="1" stroke-dasharray="4 8"/>
  <g text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#fff"><text x="600" y="348" font-size="13" font-weight="700" letter-spacing="2" fill="#98a2b3">THE TARGET</text><text x="600" y="382" font-size="28" font-weight="700">Verified</text><text x="600" y="416" font-size="28" font-weight="700">outcome</text></g>
  <rect x="375" y="342" width="450" height="60" rx="30" fill="#fff" stroke="#d0d5dd"/><text x="600" y="379" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#344054">Retry only when new evidence changes the next move</text>
</svg>
