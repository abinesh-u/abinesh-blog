<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">An engineered CI failure loop</title>
  <desc id="desc">A CI failure becomes a deduplicated work item, is handed to an agent in an isolated worktree, verified on the resulting commit, and either prepared for human review or retried once with new evidence.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10z" fill="#667085"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/></filter></defs>
  <rect width="1400" height="720" rx="28" fill="#f8fafc"/><text x="72" y="76" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" fill="#101828">CI failure loop</text><text x="72" y="108" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#667085">Every attempt ends with evidence, a bounded next step, or a human decision.</text>
  <g filter="url(#shadow)"><rect x="72" y="190" width="190" height="125" rx="16" fill="#fff" stroke="#d0d5dd"/><rect x="302" y="190" width="190" height="125" rx="16" fill="#fff" stroke="#d0d5dd"/><rect x="532" y="190" width="190" height="125" rx="16" fill="#fff" stroke="#d0d5dd"/><rect x="762" y="190" width="190" height="125" rx="16" fill="#fff" stroke="#d0d5dd"/><rect x="992" y="190" width="190" height="125" rx="16" fill="#fff" stroke="#d0d5dd"/></g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#101828"><text x="96" y="224" font-size="12" font-weight="700" letter-spacing="2" fill="#667085">01 / TRIGGER</text><text x="96" y="260" font-size="22" font-weight="700">CI failure</text><text x="96" y="286" font-size="14" fill="#667085">repo · commit · job</text><text x="326" y="224" font-size="12" font-weight="700" letter-spacing="2" fill="#667085">02 / CLAIM</text><text x="326" y="260" font-size="22" font-weight="700">Deduplicate</text><text x="326" y="286" font-size="14" fill="#667085">stable failure signature</text><text x="556" y="224" font-size="12" font-weight="700" letter-spacing="2" fill="#667085">03 / ISOLATE</text><text x="556" y="260" font-size="22" font-weight="700">Handoff</text><text x="556" y="286" font-size="14" fill="#667085">bounded task + worktree</text><text x="786" y="224" font-size="12" font-weight="700" letter-spacing="2" fill="#667085">04 / CHANGE</text><text x="786" y="260" font-size="22" font-weight="700">Agent patch</text><text x="786" y="286" font-size="14" fill="#667085">minimal diff + trace</text><text x="1016" y="224" font-size="12" font-weight="700" letter-spacing="2" fill="#667085">05 / PROOF</text><text x="1016" y="260" font-size="22" font-weight="700">Fresh checks</text><text x="1016" y="286" font-size="14" fill="#667085">tests + policy + commit</text></g>
  <path d="M262 252H292M492 252H522M722 252H752M952 252H982" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/><path d="M1087 315V390H770V428" fill="none" stroke="#12b76a" stroke-width="3" marker-end="url(#arrow)"/><path d="M1087 315V390H1170V428" fill="none" stroke="#f79009" stroke-width="3" marker-end="url(#arrow)"/><path d="M770 500V565H670V610M670 610V565H620V315" fill="none" stroke="#f04438" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif"><rect x="650" y="428" width="240" height="92" rx="16" fill="#ecfdf3" stroke="#abefc6"/><rect x="1050" y="428" width="240" height="92" rx="16" fill="#fffaeb" stroke="#fedf89"/><rect x="530" y="610" width="280" height="70" rx="16" fill="#fef3f2" stroke="#fecdca"/></g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#101828"><text x="674" y="462" font-size="12" font-weight="700" letter-spacing="2" fill="#039855">PASS</text><text x="674" y="494" font-size="22" font-weight="700">Prepare PR</text><text x="1074" y="462" font-size="12" font-weight="700" letter-spacing="2" fill="#b54708">AMBIGUOUS</text><text x="1074" y="494" font-size="22" font-weight="700">Human review</text><text x="554" y="640" font-size="12" font-weight="700" letter-spacing="2" fill="#d92d20">ACTIONABLE FAILURE</text><text x="554" y="666" font-size="18" font-weight="700">One bounded retry</text></g>
  <text x="844" y="584" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#d92d20">new evidence + changed strategy</text>
</svg>
