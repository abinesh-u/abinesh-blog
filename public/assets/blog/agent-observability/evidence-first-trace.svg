<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">An evidence-first agent trace</title><desc id="desc">Six structured stages show how a task becomes a verified outcome through an observable trace.</desc>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#111" stroke-opacity=".06"/></pattern><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111"/></marker></defs>
  <rect width="1400" height="760" fill="#FBF7F0"/><rect width="1400" height="760" fill="url(#grid)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#111"><text x="72" y="82" font-size="32" font-weight="750">An evidence-first trace</text><text x="72" y="116" font-size="17" fill="#615C56">The trace records every consequential transition, not an unverifiable narration.</text></g>
  <g stroke="#111" stroke-width="1.5" fill="#FBF7F0"><rect x="72" y="240" width="180" height="200"/><rect x="292" y="240" width="180" height="200"/><rect x="512" y="240" width="180" height="200"/><rect x="732" y="240" width="180" height="200"/><rect x="952" y="240" width="180" height="200"/><rect x="1172" y="240" width="156" height="200"/></g>
  <g stroke="#111" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M252 340h40"/><path d="M472 340h40"/><path d="M692 340h40"/><path d="M912 340h40"/><path d="M1132 340h40"/></g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#111"><text x="92" y="278" font-size="12" font-weight="700" letter-spacing="2">01 / INPUT</text><text x="92" y="326" font-size="24" font-weight="700">Task</text><text x="92" y="354" font-size="15" fill="#615C56">goal + constraints</text><text x="312" y="278" font-size="12" font-weight="700" letter-spacing="2">02 / STATE</text><text x="312" y="326" font-size="24" font-weight="700">Context</text><text x="312" y="354" font-size="15" fill="#615C56">sources + memory</text><text x="532" y="278" font-size="12" font-weight="700" letter-spacing="2">03 / ROUTE</text><text x="532" y="326" font-size="24" font-weight="700">Decision</text><text x="532" y="354" font-size="15" fill="#615C56">policy + budget</text><text x="752" y="278" font-size="12" font-weight="700" letter-spacing="2">04 / ACT</text><text x="752" y="326" font-size="24" font-weight="700">Tool call</text><text x="752" y="354" font-size="15" fill="#615C56">scoped action</text><text x="972" y="278" font-size="12" font-weight="700" letter-spacing="2">05 / PROOF</text><text x="972" y="326" font-size="24" font-weight="700">Verify</text><text x="972" y="354" font-size="15" fill="#615C56">test + evaluator</text><text x="1192" y="278" font-size="12" font-weight="700" letter-spacing="2">06 / END</text><text x="1192" y="326" font-size="24" font-weight="700">Outcome</text><text x="1192" y="354" font-size="15" fill="#615C56">accepted state</text></g>
  <g fill="#B5482E"><rect x="92" y="396" width="40" height="8"/><rect x="312" y="396" width="72" height="8"/><rect x="532" y="396" width="56" height="8"/><rect x="752" y="396" width="64" height="8"/><rect x="972" y="396" width="76" height="8"/><rect x="1192" y="396" width="56" height="8"/></g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#615C56"><text x="72" y="548">Each block adds a durable record. The accepted outcome links back to every prior artifact.</text><text x="72" y="650">task_id ────────────────────────────────────────────────────────────────────────────────────────────────►</text><text x="72" y="698">A claim becomes accepted only when the trace contains independent evidence.</text></g>
</svg>
