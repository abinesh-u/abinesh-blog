<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc">
  <title id="title">The observability improvement loop</title><desc id="desc">Production traces become failure patterns, regression cases, offline evaluations, measured deployments, and new production traces.</desc>
  <defs><pattern id="g" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#111" stroke-opacity=".055"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#111"/></marker></defs>
  <rect width="1100" height="900" fill="#FBF7F0"/><rect width="1100" height="900" fill="url(#g)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#111"><text x="72" y="86" font-size="34" font-weight="760">From production trace to improvement</text><text x="72" y="120" font-size="17" fill="#615C56">Observability is useful only when evidence changes the next release.</text></g>
  <g fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"><path d="M370 305C515 215 690 255 750 370"/><path d="M792 510C755 650 590 704 470 636"/><path d="M350 574C235 472 250 340 350 285"/></g>
  <g stroke="#111" stroke-width="2" fill="#FBF7F0"><rect x="390" y="208" width="320" height="122"/><rect x="720" y="395" width="240" height="122"/><rect x="390" y="610" width="320" height="122"/><rect x="110" y="395" width="240" height="122"/></g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#111"><text x="416" y="242" font-size="12" font-weight="700" letter-spacing="2">01 / OBSERVE</text><text x="416" y="287" font-size="26" font-weight="700">Production trace</text><text x="416" y="312" font-size="15" fill="#615C56">real path + evidence</text><text x="746" y="429" font-size="12" font-weight="700" letter-spacing="2">02 / DIAGNOSE</text><text x="746" y="474" font-size="24" font-weight="700">Pattern</text><text x="746" y="499" font-size="15" fill="#615C56">failure shape</text><text x="416" y="644" font-size="12" font-weight="700" letter-spacing="2">03 / PRESERVE</text><text x="416" y="689" font-size="26" font-weight="700">Regression case</text><text x="416" y="714" font-size="15" fill="#615C56">curated + labelled</text><text x="136" y="429" font-size="12" font-weight="700" letter-spacing="2">04 / MEASURE</text><text x="136" y="474" font-size="24" font-weight="700">Evaluate</text><text x="136" y="499" font-size="15" fill="#615C56">release decision</text></g>
  <g fill="#B5482E"><circle cx="680" cy="268" r="8"/><circle cx="930" cy="457" r="8"/><circle cx="680" cy="670" r="8"/><circle cx="320" cy="457" r="8"/></g>
  <circle cx="550" cy="470" r="105" fill="#111"/><g font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle"><text x="550" y="456" font-size="13" font-weight="700" letter-spacing="2" fill="#D9D2C8">THE OPERATING</text><text x="550" y="486" font-size="25" font-weight="700" fill="#FBF7F0">feedback loop</text></g>
  <text x="72" y="834" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#615C56">A production incident should become a permanent test—not a recurring anecdote.</text>
</svg>
