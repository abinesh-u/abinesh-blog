<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent observability</title>
  <desc id="desc">An architectural diagram of an agent trace, from task contract through evidence and verification to a trusted outcome.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#111111" stroke-opacity=".07"/></pattern>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .045"/></feComponentTransfer></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#111111"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FBF7F0"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" filter="url(#paper)" opacity=".55"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#111111">
    <text x="100" y="120" font-size="16" font-weight="700" letter-spacing="3">SYSTEMS NOTE / 01</text>
    <text x="100" y="205" font-size="72" font-weight="760" letter-spacing="-3">Agent observability</text>
    <text x="100" y="250" font-size="22" fill="#55514C">An evidence trail for what an agent saw, did, changed, and proved.</text>
  </g>
  <g fill="none" stroke="#111111" stroke-width="2" marker-end="url(#arrow)">
    <path d="M252 514H410"/><path d="M610 514H756"/><path d="M956 514H1104"/><path d="M1304 514H1400"/>
  </g>
  <g stroke="#111111" stroke-width="2" fill="#FBF7F0">
    <rect x="100" y="430" width="152" height="168"/><rect x="410" y="430" width="200" height="168"/><rect x="756" y="392" width="200" height="244" fill="#111111"/><rect x="1104" y="430" width="200" height="168"/><rect x="1400" y="430" width="100" height="168"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#111111">
    <text x="122" y="463" font-size="12" font-weight="700" letter-spacing="2">01 / INTENT</text><text x="122" y="508" font-size="26" font-weight="700">Task</text><text x="122" y="538" font-size="16" fill="#6B6761">contract</text>
    <text x="432" y="463" font-size="12" font-weight="700" letter-spacing="2">02 / CONTEXT</text><text x="432" y="508" font-size="26" font-weight="700">Evidence</text><text x="432" y="538" font-size="16" fill="#6B6761">sources + state</text>
    <text x="778" y="425" font-size="12" font-weight="700" letter-spacing="2" fill="#FBF7F0">03 / TRAJECTORY</text><text x="778" y="470" font-size="26" font-weight="700" fill="#FBF7F0">Action</text><text x="778" y="500" font-size="16" fill="#D7D0C7">policy + tools</text>
    <text x="1126" y="463" font-size="12" font-weight="700" letter-spacing="2">04 / PROOF</text><text x="1126" y="508" font-size="26" font-weight="700">Verify</text><text x="1126" y="538" font-size="16" fill="#6B6761">independent check</text>
    <text x="1422" y="463" font-size="12" font-weight="700" letter-spacing="1">05</text><text x="1422" y="508" font-size="22" font-weight="700">Trust</text>
  </g>
  <g stroke="#B5482E" stroke-width="4" fill="none"><path d="M136 573h80"/><path d="M446 573h128"/><path d="M792 573h128" stroke="#FBF7F0"/><path d="M1140 573h128"/><path d="M1428 573h44"/></g>
  <g stroke="#B5482E" stroke-width="2" fill="none"><path d="M100 690H1500"/><path d="M100 666V714M1500 666V714"/><path d="M255 690v-24M610 690v-24M956 690v-24M1304 690v-24"/></g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#6B6761"><text x="100" y="752">TRACE / task_id · context_ids · route · action · tool_result · verifier</text><text x="100" y="798">OBSERVABILITY IS NOT A TRANSCRIPT. IT IS A RECONSTRUCTABLE RECORD OF DECISIONS AND EVIDENCE.</text></g>
  <circle cx="1485" cy="152" r="22" fill="#B5482E"/><path d="M1485 137v30M1470 152h30" stroke="#FBF7F0" stroke-width="3"/>
</svg>
